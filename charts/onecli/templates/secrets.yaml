{{- /*
The chart-managed Secrets. Three kinds, each with one rule: the operator's
own Secret wins when named; otherwise the chart owns one.

  - application secrets: only through the opt-in generator Job (never from
    values), so a secret never lands in `helm get values` or a GitOps repo
  - the gateway CA: minted by the gateway binary in a Job (see job-gateway-ca)
  - the database URL: the bundled database's assembled here; an external
    inline `database.external.url` lands here too
*/ -}}
{{- if or .Values.database.enabled .Values.database.external.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "onecli.component" (dict "root" . "component" "database") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "database") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- if .Values.database.enabled }}
  DATABASE_URL: {{ include "onecli.bundledDatabaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.database.external.url | quote }}
  {{- end }}
{{- end }}
