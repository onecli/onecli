{{- /*
The one script both generator Jobs run (job-secrets, job-gateway-ca), on
the api image's Node: it talks to the Kubernetes API with the pod's own
ServiceAccount token, so no third-party kubectl image is pulled into the
release. Idempotent: an existing Secret is reported and left untouched.
*/ -}}
{{- if or (and .Values.secrets.generate.enabled (not .Values.secrets.existingSecret)) (not .Values.gatewayCa.existingSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "onecli.component" (dict "root" . "component" "secret-tool") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secret-tool") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
data:
  secret-tool.js: |
    // Usage: node secret-tool.js generate | store-ca <dir>
    //   generate      mint the application secrets (APP_SECRET_SPECS) into
    //                 $SECRET_NAME; on a Secret this tool created earlier,
    //                 add the keys a newer chart introduced and never touch
    //                 an existing value
    //   store-ca DIR  store DIR/gateway/ca.key + ca.pem as GATEWAY_CA_KEY /
    //                 GATEWAY_CA_CERT into $SECRET_NAME
    "use strict";
    const fs = require("node:fs");
    const https = require("node:https");
    const crypto = require("node:crypto");
    const sa = "/var/run/secrets/kubernetes.io/serviceaccount";
    const token = fs.readFileSync(`${sa}/token`, "utf8").trim();
    const ca = fs.readFileSync(`${sa}/ca.crt`);
    const ns = process.env.NAMESPACE;
    const name = process.env.SECRET_NAME;
    // The shapes scripts/lib/secrets.mjs SECRET_SPECS mints for compose:
    // one value, read by every process that shares it.
    const b64 = () => crypto.randomBytes(32).toString("base64");
    const hex = () => crypto.randomBytes(32).toString("hex");
    const APP_SECRET_SPECS = {
      BETTER_AUTH_SECRET: b64,
      SECRET_ENCRYPTION_KEY: b64,
      GATEWAY_INTERNAL_SECRET: b64,
      RUNNER_TOKEN: () => `rnr_${hex()}`,
      RUNNER_SESSION_KEY: () => `k1.${hex()}`,
      CHANNEL_ADAPTER_TOKEN: () => `cha_${hex()}`,
    };
    const request = (method, path, body, contentType = "application/json") =>
      new Promise((resolve, reject) => {
        const req = https.request(
          {
            host: process.env.KUBERNETES_SERVICE_HOST,
            port: process.env.KUBERNETES_SERVICE_PORT || 443,
            method,
            path,
            ca,
            headers: { authorization: `Bearer ${token}`, "content-type": contentType },
          },
          (res) => {
            let data = "";
            res.on("data", (c) => (data += c));
            res.on("end", () => resolve({ status: res.statusCode, data }));
          },
        );
        req.on("error", reject);
        if (body) req.write(JSON.stringify(body));
        req.end();
      });
    // A refused write echoes the request object in `message`/`details`,
    // secret values included: report the status and the API's `reason` only.
    const refusal = (verb, res) => {
      let reason = "";
      try { reason = JSON.parse(res.data).reason ?? ""; } catch {}
      return new Error(`${verb} ${name}: ${res.status} ${reason}`);
    };
    // Upgrade path for a Secret minted by an older chart: add only the keys
    // it lacks. `secrets.generate.enabled` makes `<release>-secrets` the
    // chart's own Secret, and adding a key never changes a value, so this
    // is safe whoever created it. A merge patch on `data` adds keys and
    // leaves every existing value as stored; the resourceVersion
    // precondition turns a concurrent edit into a 409 and a retry instead
    // of a lost write.
    const addMissing = async (base, secret) => {
      const present = secret.data ?? {};
      const missing = Object.keys(APP_SECRET_SPECS).filter((key) => !present[key]);
      if (missing.length === 0) {
        console.log(`secret ${name} exists with every key; leaving it untouched`);
        return "done";
      }
      const data = Object.fromEntries(
        missing.map((key) => [key, Buffer.from(APP_SECRET_SPECS[key]()).toString("base64")]),
      );
      const patched = await request(
        "PATCH",
        `${base}/${name}`,
        { metadata: { resourceVersion: secret.metadata.resourceVersion }, data },
        "application/merge-patch+json",
      );
      if (patched.status === 409) return "retry";
      if (patched.status !== 200) throw refusal("PATCH", patched);
      console.log(`added ${missing.join(", ")} to ${name}; existing values untouched`);
      return "done";
    };
    const main = async () => {
      const [mode, dir] = process.argv.slice(2);
      const base = `/api/v1/namespaces/${ns}/secrets`;
      for (let attempt = 0; attempt < 5; attempt += 1) {
        const existing = await request("GET", `${base}/${name}`);
        if (existing.status === 200) {
          if (mode !== "generate") {
            console.log(`secret ${name} exists; leaving it untouched`);
            return;
          }
          if ((await addMissing(base, JSON.parse(existing.data))) === "done") return;
          continue;
        }
        if (existing.status !== 404) throw refusal("GET", existing);
        let stringData;
        if (mode === "generate") {
          stringData = Object.fromEntries(
            Object.entries(APP_SECRET_SPECS).map(([key, mint]) => [key, mint()]),
          );
        } else if (mode === "store-ca") {
          stringData = {
            GATEWAY_CA_KEY: fs.readFileSync(`${dir}/gateway/ca.key`, "utf8"),
            GATEWAY_CA_CERT: fs.readFileSync(`${dir}/gateway/ca.pem`, "utf8"),
          };
        } else {
          throw new Error(`unknown mode ${mode}`);
        }
        const created = await request("POST", base, {
          apiVersion: "v1",
          kind: "Secret",
          metadata: { name, namespace: ns },
          type: "Opaque",
          stringData,
        });
        // Raced by another writer: go round again and treat it as existing.
        if (created.status === 409) continue;
        if (created.status !== 201) throw refusal("POST", created);
        console.log(`${mode === "generate" ? "minted" : "stored"} ${name}`);
        return;
      }
      throw new Error(`${name}: gave up after repeated concurrent edits`);
    };
    main().catch((error) => {
      console.error(String(error));
      process.exit(1);
    });
{{- end }}
