{{- /*
The one script both generator Jobs run (job-secrets, job-gateway-ca), on
the api image's Node: it talks to the Kubernetes API with the pod's own
ServiceAccount token, so no third-party kubectl image is pulled into the
release. Idempotent: an existing Secret is reported and left untouched.
*/ -}}
{{- if or (and .Values.secrets.generate.enabled (not .Values.secrets.existingSecret)) (not .Values.gatewayCa.existingSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "onecli.component" (dict "root" . "component" "secret-tool") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secret-tool") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
data:
  secret-tool.js: |
    // Usage: node secret-tool.js generate | store-ca <dir>
    //   generate      mint BETTER_AUTH_SECRET, SECRET_ENCRYPTION_KEY,
    //                 GATEWAY_INTERNAL_SECRET, RUNNER_TOKEN into $SECRET_NAME
    //   store-ca DIR  store DIR/gateway/ca.key + ca.pem as GATEWAY_CA_KEY /
    //                 GATEWAY_CA_CERT into $SECRET_NAME
    "use strict";
    const fs = require("node:fs");
    const https = require("node:https");
    const crypto = require("node:crypto");
    const sa = "/var/run/secrets/kubernetes.io/serviceaccount";
    const token = fs.readFileSync(`${sa}/token`, "utf8").trim();
    const ca = fs.readFileSync(`${sa}/ca.crt`);
    const ns = process.env.NAMESPACE;
    const name = process.env.SECRET_NAME;
    const request = (method, path, body) =>
      new Promise((resolve, reject) => {
        const req = https.request(
          {
            host: process.env.KUBERNETES_SERVICE_HOST,
            port: process.env.KUBERNETES_SERVICE_PORT || 443,
            method,
            path,
            ca,
            headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
          },
          (res) => {
            let data = "";
            res.on("data", (c) => (data += c));
            res.on("end", () => resolve({ status: res.statusCode, data }));
          },
        );
        req.on("error", reject);
        if (body) req.write(JSON.stringify(body));
        req.end();
      });
    const main = async () => {
      const [mode, dir] = process.argv.slice(2);
      const base = `/api/v1/namespaces/${ns}/secrets`;
      const existing = await request("GET", `${base}/${name}`);
      if (existing.status === 200) {
        console.log(`secret ${name} exists; leaving it untouched`);
        return;
      }
      if (existing.status !== 404) throw new Error(`GET ${name}: ${existing.status} ${existing.data}`);
      let stringData;
      if (mode === "generate") {
        const b64 = () => crypto.randomBytes(32).toString("base64");
        stringData = {
          BETTER_AUTH_SECRET: b64(),
          SECRET_ENCRYPTION_KEY: b64(),
          GATEWAY_INTERNAL_SECRET: b64(),
          RUNNER_TOKEN: `rnr_${crypto.randomBytes(32).toString("hex")}`,
        };
      } else if (mode === "store-ca") {
        stringData = {
          GATEWAY_CA_KEY: fs.readFileSync(`${dir}/gateway/ca.key`, "utf8"),
          GATEWAY_CA_CERT: fs.readFileSync(`${dir}/gateway/ca.pem`, "utf8"),
        };
      } else {
        throw new Error(`unknown mode ${mode}`);
      }
      const created = await request("POST", base, {
        apiVersion: "v1",
        kind: "Secret",
        metadata: { name, namespace: ns },
        type: "Opaque",
        stringData,
      });
      if (created.status === 409) {
        console.log(`secret ${name} appeared meanwhile; leaving it untouched`);
        return;
      }
      // A refused create echoes the request object in `message`/`details`,
      // secret values included: log the status and the API's `reason` only.
      if (created.status !== 201) {
        let reason = "";
        try { reason = JSON.parse(created.data).reason ?? ""; } catch {}
        throw new Error(`POST ${name}: ${created.status} ${reason}`);
      }
      console.log(`${mode === "generate" ? "minted" : "stored"} ${name}`);
    };
    main().catch((error) => {
      console.error(String(error));
      process.exit(1);
    });
{{- end }}
