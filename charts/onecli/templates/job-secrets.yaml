{{- /*
Opt-in: mint the application secrets ONCE into `<fullname>-secrets`. A Job
rather than `randAlphaNum` in a template because template randomness is
re-rolled on every `helm template`/`upgrade` (and by GitOps diffing), which
would rotate the encryption key and orphan every stored secret. The Job is
idempotent: it exits 0 without touching an existing Secret.

Runs under its own ServiceAccount with a Role scoped to create/get ONE
named Secret in the release namespace, nothing else, on the api image's
Node (configmap-secret-tool): no third-party tool image enters the release.
*/ -}}
{{- if and .Values.secrets.generate.enabled (not .Values.secrets.existingSecret) }}
{{- $name := include "onecli.component" (dict "root" . "component" "secrets") }}
{{- $jobName := printf "%s-generate" $name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secrets-generate") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secrets-generate") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secrets-generate") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $jobName }}
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "secrets-generate") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "onecli.selectorLabels" (dict "root" . "component" "secrets-generate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $jobName }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "onecli.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      {{- include "onecli.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: generate
          image: {{ include "onecli.image" (dict "root" . "service" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "onecli.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          env:
            - name: SECRET_NAME
              value: {{ $name | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
          command: ["node", "/tools/secret-tool.js", "generate"]
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: tools
          configMap:
            name: {{ include "onecli.component" (dict "root" . "component" "secret-tool") }}
{{- end }}
