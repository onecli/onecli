{{- /*
The dashboard. Stateless; its server side reads sessions through the same
auth factory as the api (hence the same secrets) and forwards the one form
submit that lands on its /auth page paths to the api over API_INTERNAL_URL.
*/ -}}
{{- $name := include "onecli.component" (dict "root" . "component" "web") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    {{- include "onecli.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 10254
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onecli.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  {{- include "onecli.annotations" . | nindent 2 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "onecli.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "onecli.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        onecli.sh/role: web
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "onecli.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "onecli.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "onecli.image" (dict "root" . "service" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "onecli.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 10254
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "onecli.databaseSecretName" . }}
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "onecli.secretsName" . }}
                  key: BETTER_AUTH_SECRET
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "onecli.secretsName" . }}
                  key: SECRET_ENCRYPTION_KEY
            {{- include "onecli.publicUrlEnv" . | nindent 12 }}
            {{- include "onecli.flagsEnv" . | nindent 12 }}
            - name: MAX_ORGS_PER_USER
              value: {{ .Values.maxOrgsPerUser | quote }}
            - name: GATEWAY_INTERNAL_URL
              value: {{ include "onecli.gatewayUrl" . | quote }}
            - name: API_INTERNAL_URL
              value: {{ include "onecli.apiUrl" . | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
