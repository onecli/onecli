name: CI cache seed

# ci.yml runs only on pull_request, and GitHub scopes PR-written caches to
# the writing PR's merge ref — so nothing ever seeds a cache a NEW PR can
# restore, and every fresh PR's unit-rust + e2e lanes recompile the
# gateway from zero (~14 min each, measured). Base- and default-branch
# caches are readable by every PR, so this workflow does one warm build per
# merge and the PR lanes restore from it: the rust caches via the
# `gateway-debug` shared-key (must match ci.yml's two Swatinem steps), the
# agent image pair via the `ci-agent-base` and `ci-agent` buildx scopes.
#
# Side benefit: a merge that breaks the gateway build or the agent image
# surfaces HERE immediately, instead of on the next unrelated PR.

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer merge supersedes an in-flight seed of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Seed PR caches
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same reason as ci.yml's e2e lane: the agent image pair holds the base
      # three times on the runner (builder cache, OCI layout, its re-import)
      # beside the Rust target. The unused preinstalled toolchains (~10 GB)
      # go first.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gateway -> target
          shared-key: gateway-debug

      # The same debug binary both ci.yml lanes spawn.
      - name: Build the gateway
        run: cargo build --manifest-path apps/gateway/Cargo.toml --bin onecli-gateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Populates the buildx layer caches only — the images themselves are
      # discarded (no load, no push). Same two-image shape and the same
      # base hand-off as ci.yml's e2e lane: the base is exported as an OCI
      # layout and named into the thin build, because the docker-container
      # builder cannot see a `load`ed daemon image.
      - name: Build the agent base image
        id: agent-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-base.Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/agent-base,tar=false
          cache-from: type=gha,scope=ci-agent-base
          cache-to: type=gha,mode=max,scope=ci-agent-base

      - name: Build the agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent.Dockerfile
          build-contexts: |
            onecli-agent-base:local=oci-layout://${{ runner.temp }}/agent-base@${{ steps.agent-base.outputs.digest }}
          tags: onecli-agent:seed
          cache-from: type=gha,scope=ci-agent
          cache-to: type=gha,mode=max,scope=ci-agent
