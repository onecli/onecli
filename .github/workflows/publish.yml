# Builds and publishes the OneCLI self-host images — one per
# docker/<service>.Dockerfile — on every v* tag: multi-arch (amd64 + arm64)
# manifests at ghcr.io/onecli/onecli-<service>, tagged <version>,
# <major>.<minor>, and (non-prerelease tags only) latest — exactly the names
# docker/docker-compose.yml pulls, so `docker compose up` runs from pre-built
# images with no source build.
#
# Maintainer-owned, kept in lockstep with release.yml: the repository guard on
# every job makes this workflow a no-op anywhere but onecli/onecli (forks and
# mirrored copies included). Never delete this file — synced copies propagate
# a deletion.
name: Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Display name only — without it every run shows 14 rows of
    # "build (<service>, <arch>)"; this renders "gateway (amd64)" instead.
    name: ${{ matrix.service }} (${{ matrix.arch }})
    if: github.repository == 'onecli/onecli'
    strategy:
      matrix:
        # `agent` and `runner` join the stack with hosted agents: the agent image is
        # the sandbox base, the runner is the daemon that spawns it. `migrations`
        # is the one-shot schema runner the api gates on. Paths derive by
        # convention (docker/<service>.Dockerfile).
        service: [web, gateway, api, migrations, runner, agent, channel-adapter, ssh-terminator]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}

      - name: Resolve app version
        id: appversion
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # The agent image is two images: docker/agent-base.Dockerfile
      # is the OS surface, built here first for this arch and pushed by digest
      # to its own name, then handed to the agent build through the one arg
      # the Dockerfile exposes. By digest, never by tag: a published agent
      # image must not change because its base was re-pushed. Only the agent
      # entry pays for it; the base is not a service and has no compose name.
      - name: Build and push the agent base by digest
        if: matrix.service == 'agent'
        id: build-agent-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-base.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-base-${{ matrix.arch }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # AGENT_BASE_IMAGE is read by the agent Dockerfile alone; every other
          # Dockerfile ignores an arg it does not declare (an empty value here
          # is exactly that case).
          build-args: |
            APP_VERSION=${{ steps.appversion.outputs.value }}
            AGENT_BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-base@${{ steps.build-agent-base.outputs.digest }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # The base's digest travels in its own artifact family. `digest-agent-*`
      # (the agent manifest's download glob) would also match
      # `digest-agent-base-<arch>` and fold the base into the agent manifest.
      - name: Export the agent base digest
        if: matrix.service == 'agent'
        run: |
          mkdir -p /tmp/base-digests
          digest="${{ steps.build-agent-base.outputs.digest }}"
          touch "/tmp/base-digests/${digest#sha256:}"

      - name: Upload the agent base digest
        if: matrix.service == 'agent'
        uses: actions/upload-artifact@v7
        with:
          name: base-digest-${{ matrix.arch }}
          path: /tmp/base-digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.service }} (manifest)
    if: github.repository == 'onecli/onecli'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        # `agent` and `runner` join the stack with hosted agents: the agent image is
        # the sandbox base, the runner is the daemon that spawns it. `migrations`
        # is the one-shot schema runner the api gates on. Paths derive by
        # convention (docker/<service>.Dockerfile).
        service: [web, gateway, api, migrations, runner, agent, channel-adapter, ssh-terminator]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}

  # The agent base's manifest, tagged like a service so a self-hoster can
  # `FROM ghcr.io/onecli/onecli-agent-base:<version>` and GHCR holds no
  # orphaned untagged versions of it. Not a `merge` matrix entry: the base is
  # not a service (compose never pulls it) and its digests come from the
  # agent's build job, not a job of its own.
  merge-agent-base:
    name: agent-base (manifest)
    if: github.repository == 'onecli/onecli'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/base-digests
          pattern: base-digest-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-base
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/base-digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-base@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-base:${{ steps.meta.outputs.version }}

  # The Helm chart, pushed as an OCI artifact beside the images it pulls
  # (oci://ghcr.io/onecli/charts/onecli) and signed with cosign keyless
  # (Sigstore, GitHub OIDC). Both chart version and appVersion are stamped
  # from the tag, so `helm install ... --version 2.11.0` pulls the 2.11.0
  # images: one version to reason about. Waits for every image manifest so
  # a chart version never exists before the images it pulls do.
  #
  # ONE-TIME after the first run: GHCR creates the `charts/onecli` package
  # PRIVATE (every package a workflow creates starts that way; the image
  # packages were flipped once, by hand). Open
  # https://github.com/orgs/onecli/packages/container/charts%2Fonecli/settings
  # and set the visibility to Public, or `helm pull` fails with 403 for
  # everyone outside the org.
  chart:
    name: chart (oci)
    if: github.repository == 'onecli/onecli'
    runs-on: ubuntu-latest
    needs: [merge, merge-agent-base]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      # Exact tag on purpose: sigstore publishes floating majors only up to
      # v3; `@v4` does not resolve and fails the job at "Set up job"
      # (release 2.11.0). publish-workflow.test.mjs pins the exact form.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve chart version
        id: version
        # The tag is `v<semver>`; the chart takes the semver verbatim.
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: |
          helm lint charts/onecli \
            --set externalUrl=https://onecli.example.com \
            --set secrets.existingSecret=onecli-secrets

      - name: Package
        run: |
          helm package charts/onecli \
            --version "${{ steps.version.outputs.value }}" \
            --app-version "${{ steps.version.outputs.value }}" \
            --destination /tmp/chart

      # docker/login-action, like the image jobs, not `helm registry login`:
      # helm writes its own registry config, which cosign never reads, so
      # the push succeeded and the signature upload got UNAUTHORIZED
      # (release 2.11.1). Docker's credential store is read by both (helm
      # falls back to it).
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          out=$(helm push /tmp/chart/onecli-${{ steps.version.outputs.value }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<< "$out")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/onecli@${{ steps.push.outputs.digest }}

      - name: Verify
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/onecli@${{ steps.push.outputs.digest }}
          helm show chart oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/onecli \
            --version "${{ steps.version.outputs.value }}"
