name: Setup Node.js
description: Setup pnpm, Node.js, install dependencies, and generate Prisma client

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        # Exact, not "22": a major-only spec takes whatever the runner image
        # has cached, which can trail a security release by days. Keep it
        # equal to the FROM node:<x.y.z> pins in the Dockerfiles.
        node-version: 22.23.4
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma client
      shell: bash
      run: pnpm --filter @onecli/db generate
