# The DEV stores — postgres for every `pnpm dev` (and `pnpm db:up`), plus a
# profile-gated redis the launcher starts only for cloud-edition dev.
# Deliberately a separate file from docker-compose.yml: the full stack's
# interpolation guards (`${BETTER_AUTH_SECRET:?…}`) would make starting a bare
# database demand secrets it never uses.
#
# `name: onecli` matches the main file ON PURPOSE: same project, so this is the
# SAME postgres — container onecli-postgres-1, volume onecli_pgdata — that a
# `docker compose -f docker/docker-compose.yml up` addresses. The service block
# below must stay a verbatim copy of the main file's postgres service.
#
# Invoke with `--project-directory .` from the repo root so `${…}`
# interpolation reads the root `.env` (the dev file), not `docker/.env` (the
# self-host install's file).
name: onecli

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onecli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onecli}
      POSTGRES_DB: ${POSTGRES_DB:-onecli}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${ONECLI_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onecli}"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - onecli

  # Cloud-edition DEV cache. `pnpm dev` starts this only when your .env says
  # EDITION=cloud — self-hosted Redis is enterprise-licensed (the gateway
  # refuses REDIS_HOST unentitled), so nothing on the onprem/default path ever
  # touches it. Profile-gated as belt-and-braces: `pnpm db:up` targets
  # `postgres` by name and db:down/db:nuke never see this service; the
  # launcher's explicit `up redis` activates the profile itself.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "${ONECLI_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - onecli

volumes:
  pgdata:

networks:
  onecli:
    driver: bridge
