# Workspace root for the gateway: a virtual manifest over a flat crates/
# directory. The binary is crates/onecli-gateway (the composition root); every
# other member is a library crate, layered so Cargo itself rejects a cycle.
# See the "Gateway (Rust)" section of CLOUD-DEVELOPMENT.md for the layer map.
[workspace]
resolver = "2"
# Members are listed explicitly, in two groups, because the split IS the
# licence boundary and a glob would hide it: `crates/*` cannot express "except
# the licensed ones", and `exclude` silently wins over an explicit glob (tried;
# it dropped ee from the workspace).
#
# APACHE-2.0 — everything the free product needs.
members = [
  "crates/approval",
  "crates/apps",
  "crates/ca",
  "crates/cache",
  "crates/common",
  "crates/context",
  "crates/crypto",
  "crates/db",
  "crates/inject",
  "crates/policy",
  "crates/policy-engine",
  "crates/proxy",
  "crates/server",
  "crates/shutdown",
  "crates/summary",
  "crates/telemetry",
  "crates/vault",
  "crates/onecli-gateway",

  # ENTERPRISE-LICENSED — see /LICENSE-ENTERPRISE and crates/ee/LICENSE.
  # The licence is scoped by PATH SEGMENT here, the same shape as
  # apps/web/src/ee/ and packages/api/src/ee/: anything under `crates/ee/`
  # is licensed, everything above is not.
  "crates/ee/ee",
]

# Deliberately NO `default-members`: with it, a bare `cargo test` in this
# directory silently runs only the bin crate's 2 tests instead of the
# workspace's 841 — a false green for anyone who does not type `--workspace`.
# Without it, bare `cargo build`/`run`/`test` cover every member, and
# `cargo run` still resolves because the workspace has exactly one bin target.

[workspace.dependencies]
# Single version pin per external dependency; members write
# `name = { workspace = true }`. Internal crates stay path-declared in
# the members that use them, so the graph is readable per crate.
anyhow = "1"
ap-client = "0.9.0"
ap-noise = "0.9.0"
ap-proxy-client = "0.9.0"
ap-proxy-protocol = "0.9.0"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-kms = "1"
aws-sdk-sts = "1"
aws-sigv4 = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = "9"
percent-encoding = "2"
rcgen = "0.13"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

# Profiles are only honored at the workspace root.
[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
